<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
         margin: 0;
         padding: 0;
         box-sizing: border-box;   
        }
        .parent{
            height: 200px;
            width: 200px;
            perspective: 800px;
        }
        .container{
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
          transform-style: preserve-3d;
            animation: cube 15s linear 2s infinite alternate;
            position: relative;
        }
        .box{
             height: 200px;
            width: 200px;
             display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid white;
            color:white;
            position: absolute;
            font-size: 30px;
            font-weight: 700;
        }
        body{
            background-color: rgb(80, 43, 114);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .box1{
            background-color: red;
            transform: translateZ(100px);
        }
        .box2{
            background-color: blue;
            transform: rotateY(90deg)translateZ(100px);
        }
        .box3{
            background-color: green;
            transform: rotateY(90deg)translateZ(100px);
        }
        .box4{
            background-color: orange;
             transform: rotateY(-90deg)translateZ(100px);

        }
        .box5{
            background-color: yellow;
             transform: rotateX(90deg)translateZ(100px);
        }
        .box6{
            background-color: chartreuse;
             transform: rotateX(-90deg)translateZ(100px);

        }
        @keyframes cube{
            0%{
                transform: rotateX(0) rotateY(0);
            }
            25%{
                 transform: rotateX(90deg) rotateY(90deg);
            }
            50%{
                 transform: rotateX(180deg) rotateY(180deg);
            }
            75%{
                 transform: rotateX(270deg) rotateY(270deg);
            }
            100%{
                 transform: rotateX(360deg) rotateY(360deg);
            }
        }
    </style>
</head>
<body>
   <div class="parent">
    <div class="container">
    <div class="box box1">top</div>
    <div class="box box2">front</div>
    <div class="box box3">back</div>
    <div class="box box4">bottom</div>
    <div class="box box5">right</div>
    <div class="box box6">left</div>
   </div>
   </div>
</body>
</html>
