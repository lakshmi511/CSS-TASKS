<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
        height:600px;
        width:1000px;
        display:grid;
        gap:5px;
        grid-template-columns:repeat(6 200px);
        grid-template-rows: 100px 200px 100px 200px;
        

         }
         .box{
            background-color: antiquewhite;
            border-radius:5px;
            border:2px solid white;
         }
    
        
        .new{
        
            background-color:midnightblue;
            grid-column: 1/6;
        
            text-align: center;
            padding-top: 40px;
            border-radius:5px;
        }
        .blue{
            background-color: cadetblue;
            border: 2px solid white;
            grid-column: 1/3;
            padding-top: 80px;
            padding-left: 90px;
            border-radius:5px;
        }
        .green{
            background-color: forestgreen;
            border:2px solid white;
            grid-column:3/4;
    
            padding-top:80px;
            padding-left:90px;
            border-radius:5px;
        }
        .red{
            background-color:red;
            border:2px solid white;
            grid-column: 4/6;
            grid-row: 2/4;
            border-radius:5px;
            padding-top:120px;
            padding-left: 130px;
        }
        .purple{
            background-color: purple;
            grid-column:1/2;
            border-radius:5px;
            padding-top:40px;
            padding-left:50px;
            
        }
        .orange{
            background-color: orange;
            grid-column:2/3;
            border-radius:5px;
            padding-top:40px;
            padding-left:40px;
        }
        .aqua{
            background-color: aquamarine;
            grid-column:3/4;
            border-radius:5px;
            padding-top: 50px;
            padding-left:70px;
        }
        .gray{
            background-color: gray;
            grid-column: 1/6;
            border-radius:5px;
            padding-top:120px;
            padding-left:450px;

        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="one new">Headline</div>
  
    <div class="one blue">News 1</div>
    <div class="one green">News 2</div>
    <div class="one red" >Advertisements</div>
    <div class="one purple">News 3</div>
    <div class="one orange">News 4</div>
    <div class="one aqua">News 5</div>
    <div class="one gray">Footer</div>
    </div>
</body>
</html>
