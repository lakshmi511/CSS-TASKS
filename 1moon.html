<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            background-color: black;
            height:400px;
            width:400px;
        }
        
        .child{
        height:300px;
        width:300px;
        color:yellow;
        text-align:center;
        line-height:300px;
        border:2px solid black;
        border-radius:50%;
        box-shadow:10px 10px 5px 5px white;
        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="child">vara</div>
    
</body>
</html>
