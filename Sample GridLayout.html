<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height:100vh;
            display:grid;
            grid-template-columns: repeat(4,1fr);
            grid-template-rows:25% 50% 25%;
        }
        .box{
            font-size: 25px;
            border:2px solid black;
        }
        header{
            background-color: chocolate;
            grid-area:1/1/2/5;
            text-align: center;
            padding: 70px;
        }
        aside{
            background-color: green;
            grid-area:2/4/3/2;
            text-align: center;
            text-align: center;
            padding: 100px;
        }
        .right{
            background-color: blue;
            grid-area:2/1/3/2;
            text-align: center;
            padding: 100px;
        }
        .main{
            background-color: aqua;
            /* grid-area:2/1/3/4 ; */
            color:white;
            text-align: center;
            padding: 100px;
        }
        .footer{
            background-color: blanchedalmond;
            grid-area:3/1/4/5;
            text-align: center;
            padding: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class=" box header">Header</header>
        <aside class=" box aside">Main</aside>
        <main class=" box main">Right</main>
        <right class="box right">Left Bar</right>
        <footer class=" box footer">footer</footer>
    </div>
    
</body>
</html>
